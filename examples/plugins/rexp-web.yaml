schemaVersion: 1
id: rexp-web
description: Local Web dashboard for remote files, SSH nodes, GPU/NPU resources and REXP experiments.
components:
  - id: web
    target: local
    description: Install and manage the independent rexp-web application on this MCP host.
    setup: >
      本插件安装在 MCP 控制端，不安装到远端实验服务器。需要 Node.js 22 或以上及 npm。
      正式包地址为 https://www.npmjs.com/package/rexp-web ，从官方 npm registry 安装 rexp-web@latest。
      使用 plugin-activate install 安装；已安装时使用 plugin-activate update 更新，
      安装目录由宿主提供 pluginInstallDir，个人连接配置保留在用户目录。安装不注册自启动项。
      使用发行包自带的页面与 CLI，无需克隆源码、运行 npm run build 或启动 Vite，勿将 pluginRoot 指向开发目录。
      Windows 节点状态兼容由 rexp-web 0.1.2 及以上版本处理，无需修改 SSH-MCP 核心或安装远端 REXP。
      rexp-web 0.1.4 及以上提供单栏服务器文件浏览与上传下载，需要宿主支持 sftp-list 以及原有传输工具；无需安装远端 FTP 服务或 REXP。
      0.1.5 及以上支持重命名和确认删除，需要宿主支持 sftp-manage；访问范围复用 allowedRemoteDirectories，文件页会说明权限设置位置。
      安装后读取 web-operations skill，询问用户是否开启登录自启动，再执行 plugin-run
      args=[configure,--autostart,on] 或 [configure,--autostart,off]，随后执行 [open]。
      用户已提供选择时不重复询问。访问地址以 open / status 返回为准，默认 http://127.0.0.1:5173/ 。
      此地址是本机控制台，npm 页面仅用于下载和查看说明。提醒用户把控制台地址加入书签。
      查看状态用 [status,--json]；修改自启动用 [autostart,on] 或 [autostart,off]；
      启停用 [start] / [stop]。Agent 退出不关闭 Web。升级前明确告知需要重启 Web 才能加载新版，
      保留用户的自启动偏好和个人配置，不为升级重新初始化远端平台。
      update 绕过旧 npm 缓存向官方源确认最新版本，下载并校验确切版本；无法确认时明确失败，不将旧版本称为更新成功。
      更新正在运行的 Web 时会先 stop，再安装、校验和 start；失败时恢复旧安装和原运行状态。
      已安装时 install 只复用，不执行升级。npm 缓存不可写时使用当前用户的私有缓存，错误保留源地址与缓存路径。
    source:
      kind: npm
      location: https://registry.npmjs.org/
      package: rexp-web
    entry: ['${nodeExecutable}', '${pluginRoot}/scripts/web.mjs']
    version: ['${nodeExecutable}', '${pluginRoot}/scripts/web.mjs', version, '--json']
    env:
      HANDFREE_MCP_DIR: '${sshMcpDir}'
      HANDFREE_MCP_CONFIG: '${sshMcpConfig}'
      HANDFREE_PLUGINS_CONFIG: '${pluginRegistry}'
    install: ['${nodeExecutable}', '${sshMcpDir}/examples/plugins/rexp-web-install.cjs', '${pluginInstallDir}', install]
    update: ['${nodeExecutable}', '${sshMcpDir}/examples/plugins/rexp-web-install.cjs', '${pluginInstallDir}', update]
    skills:
      list: ['${nodeExecutable}', '${pluginRoot}/scripts/web.mjs', skills, list, '--json']
      show: ['${nodeExecutable}', '${pluginRoot}/scripts/web.mjs', skills, show, '${skill}', '--json']
