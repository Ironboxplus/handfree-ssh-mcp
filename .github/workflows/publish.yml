name: Publish to npm

# Auto-publish when a version tag is pushed, e.g. `git tag v1.0.14 && git push --tags`.
#
# Publishing uses npm trusted publishing (OIDC): npmjs.com trusts this
# repository's publish.yml, so no npm token is stored here and no one-time
# password is needed. One-time setup on npmjs.com: package settings ->
# Trusted Publisher -> GitHub Actions, owner Ironboxplus, repository
# handfree-ssh-mcp, workflow publish.yml. Requires npm >= 11.5.1.
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm install -g npm@^11.5.1

      - run: npm ci

      # Runs the build then the full node --test suite (see package.json "test").
      - run: npm test

      # Fail fast if the tag doesn't match package.json version (tag v1.0.14 -> 1.0.14).
      - name: Verify tag matches package.json version
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          echo "package.json=$PKG tag=$TAG"
          test "$PKG" = "$TAG"

      - run: npm publish
