# PLAN.MD P0-02 real SSH lab: two independent OpenSSH/SFTP containers,
# `source` and `destination`, sharing one image (Dockerfile in this
# directory) but each getting its own host key, file root, and log at
# container start (see entrypoint.sh).
#
# This file defines only logical service/network names. Actual container,
# network, and image names are namespaced by the caller via `docker compose
# -p <unique-project-name>` (or COMPOSE_PROJECT_NAME) — see
# scripts/ssh-lab.mjs, which generates a fresh unique project name per run.
# Never invoke this file with a shared/fixed project name on a shared host.
#
# Host ports are published as ephemeral ("0:22") so this fixture never
# collides with a fixed port on a shared machine; scripts/ssh-lab.mjs
# discovers the assigned ports via `docker compose port`.
# NOTE on image tags: `source` and `destination` build from the identical
# Dockerfile/context but MUST use distinct image tags. Docker Compose builds
# services in parallel (via buildx bake); two targets exporting to the same
# tag concurrently race and one fails with "image ... already exists" (found
# for real during the first live P0-02 run against the lab host — not a
# theoretical concern).
services:
  source:
    build:
      context: .
      args:
        APT_PROXY: "${APT_PROXY:-}"
    image: "${LAB_IMAGE_TAG:-handfree-sshlab-image:local}-source"
    environment:
      LAB_ROLE: source
    ports:
      - "0:22"
    networks:
      - lab
    # PLAN.MD P0-00 ("netem runner 显式授予 CAP_NET_ADMIN") and §8.2: the
    # benchmark gates are defined under `tc netem` shaping, and `tc qdisc add`
    # inside the container fails with RTNETLINK "Operation not permitted"
    # without this. iproute2 is already in the image. NET_ADMIN is scoped to
    # this container's own network namespace, so it cannot alter the shared
    # lab host's networking. Nothing but scripts/benchmark.mjs uses it; the
    # P0-02 acceptance path is unaffected by its presence.
    cap_add:
      - NET_ADMIN
    restart: "no"

  destination:
    build:
      context: .
      args:
        APT_PROXY: "${APT_PROXY:-}"
    image: "${LAB_IMAGE_TAG:-handfree-sshlab-image:local}-destination"
    environment:
      LAB_ROLE: destination
    ports:
      - "0:22"
    networks:
      - lab
    # Same rationale as `source` above: the two-leg relay gate in §8.2 shapes
    # both legs, so both containers need to be shapeable.
    cap_add:
      - NET_ADMIN
    restart: "no"

networks:
  lab:
    driver: bridge
